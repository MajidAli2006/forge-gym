name: forge_gym
description: "Forge Gym training app (working title)."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  video_player: ^2.10.0
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  package_info_plus: ^10.2.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    # Mock content bundles (replaceable by the API layer later).
    - assets/mock/exercises.json
    - assets/mock/workouts.json
    - assets/mock/announcements.json
    - assets/mock/challenges.json
    # Exercise thumbnails only. Demo videos are downloaded on demand from
    # EnvConfig.mediaBaseUrl and cached on the device (see core/media).
